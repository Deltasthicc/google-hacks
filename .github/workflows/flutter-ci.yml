name: Flutter CI

on:
  push:
    paths:
      - "frontend/**"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend/flutter_app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: frontend/flutter_app
        run: flutter analyze
