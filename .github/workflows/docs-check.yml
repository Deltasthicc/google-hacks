name: Docs Check

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"

jobs:
  markdown-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for unresolved placeholders
        shell: bash
        run: |
          if git grep -nE "Placeholder|TODO: Add|TBD by submission day" -- README.md docs infra analytics backend frontend; then
            echo "Unresolved documentation placeholders found."
            exit 1
          fi
