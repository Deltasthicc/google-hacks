name: ML CI

on:
  push:
    paths:
      - "ml/**"
  pull_request:
    paths:
      - "ml/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run ML unit tests
        run: python -m pytest ml/tests
